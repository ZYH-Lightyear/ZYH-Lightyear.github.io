<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} · Yehang Zhang</title>
    <meta
      name="description"
      content="{{ page.description | default: page.title | escape }}"
    />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/home.css" />
    <link rel="icon" href="{{ site.baseurl }}/assets/images/studio-mark.svg" />
    <link
      rel="canonical"
      href="{{ site.url }}{{ site.baseurl }}{{ page.url }}"
    />
  </head>
  <body>
    <main class="reading-page">
      <a href="{{ site.baseurl }}/#notes">← Back to the neighborhood</a>
      <p class="eyebrow" style="margin-top: 40px">
        YEHANG ZHANG / FIELD NOTES & PHOTO JOURNAL
      </p>
      <h1>{{ page.title }}</h1>
      {% if page.date %}
      <p>{{ page.date | date: '%B %d, %Y' }}</p>
      {% endif %}{% if page.image %}<img
        src="{{ site.baseurl }}{{ page.image }}"
        alt="{{ page.image_alt | escape }}"
      />{% endif %}
      <article>{{ content }}</article>
    </main>
  </body>
</html>
